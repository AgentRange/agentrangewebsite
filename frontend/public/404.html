<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/pentapus.ico" />
    <title>404 — Agent Range</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        min-height: 100%;
        background: #000;
        color: #fff;
        overflow-x: hidden;
      }

      .page {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 2rem;
        font-family: monospace;
        text-align: center;
      }

      pre {
        font-family: monospace;
        font-size: 16px;
        line-height: 18px;
        color: #ccc;
        white-space: pre;
      }

      .code {
        margin-top: 1.5rem;
        font-size: 1rem;
        color: #ccc;
        letter-spacing: 0.2em;
      }

      p {
        margin-top: 0.75rem;
        font-size: 0.875rem;
        color: #888;
      }

      a {
        display: inline-block;
        margin-top: 1.5rem;
        font-size: 0.75rem;
        color: #666;
        text-decoration: none;
      }

      a:hover {
        color: #ccc;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <pre aria-hidden="true">
   _______
  /       \
 (  •   •  )
  \_______/
  / | | | \</pre>
      <div class="code">404</div>
      <p>that page does not exist</p>
      <a href="/">back to the home page</a>
    </div>
  </body>
</html>
